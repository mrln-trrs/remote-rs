version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    ignore:
      # TypeScript 7 (compilador nativo) rompe svelte-check 4; esperar soporte.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
